  - generic [ref=f2e15]: WINES
  - generic [ref=f2e17]: "\"These are the first wines I have tasted from Maxi Valsecchi's Kohue, which offers an intriguing mix of wines from Argentina and Napa Valley. Valsecchi worked with Nigel Kinsman at Araujo Estate in 2009 and 2010 and coninues to make the trip to Napa Valley for harvest with Kinsman each year. I am far from an expert on the wines of Argentina, but I can say that the Kohue Cabernet Sauvignon in this range is terrific.\" By Antonio Galloni on November 2025"
  - generic [ref=f2e20]: "From April in Mendoza to October in Napa Valley, each year we craft wines across two hemispheres. Our portfolio brings together wines from these two renowned regions, reflecting our experience and winemaking journey: Hand-crafted, single- vineyard Malbecs and Cabernet Sauvignons from the finest terroirs nestled in the majestic foothills of the Andes, and Cabernet Sauvignons from distinguished vineyards in the iconic heart of Napa Valley."
